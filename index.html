<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Piece Cluedo Helper</title>
    <!-- Pirate Style Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0b10;
            --panel-bg: rgba(18, 18, 26, 0.55); /* Half transparent table background */
            --header-bg: rgba(28, 28, 42, 0.7);
            --accent: #f3c246;
            --accent-glow: rgba(243, 194, 70, 0.3);
            --border: rgba(255, 215, 0, 0.2);
            --text: #f0f0f5;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 6px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            
            /* YOUR BACKGROUND IMAGE */
            background-image: 
                radial-gradient(circle at center, rgba(10, 10, 18, 0.45) 0%, rgba(5, 5, 10, 0.8) 100%), 
                url('one piece bg.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* BEAUTIFIED TOP HEADER */
        header {
            text-align: center;
            margin-top: 4px;
            margin-bottom: 8px;
            position: relative;
        }

        h1 {
            font-family: 'Pirata One', cursive, serif;
            color: var(--accent);
            margin: 0;
            font-size: 2rem;
            letter-spacing: 2px;
            text-shadow: 
                0 0 10px var(--accent-glow),
                2px 2px 0px #000,
                -2px -2px 0px #000,
                2px -2px 0px #000,
                -2px 2px 0px #000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        h1::before, h1::after {
            content: "";
            display: inline-block;
            width: 48px;                  
            height: 48px;                 
            background-image: url('one piece flag.jpg');
            background-size: contain;     
            background-repeat: no-repeat;
            background-position: center;
}

        /* BEAUTIFIED CONTROLS BUTTONS */
        .controls {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 10px;
        }

        .controls button {
            flex: 1;
            background: rgba(22, 22, 32, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--accent);
            border: 1px solid var(--border);
            padding: 7px 4px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            white-space: nowrap;
            transition: all 0.2s ease;
            letter-spacing: 0.3px;
        }

        .controls button:active {
            transform: scale(0.96);
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 12px var(--accent);
        }

        /* HALF-TRANSPARENT GLASS TABLES */
        .table-card {
            width: 100%;
            max-width: 500px;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.6);
        }

        .category-header-banner {
            background: rgba(12, 12, 18, 0.75);
            color: #fff;
            padding: 6px 10px;
            font-size: 0.9rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border);
        }

        .category-header-banner span {
            font-family: 'Pirata One', cursive, serif;
            font-size: 1.15rem;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .category-icon {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            object-fit: cover;
            border: 1px solid var(--accent);
            background: #111;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th, td {
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px 1px;
            text-align: center;
            font-size: 0.72rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        th {
            background-color: var(--header-bg);
            color: var(--accent);
            font-weight: bold;
            font-size: 0.72rem;
            padding: 5px 1px;
        }

        .item-cell {
            text-align: left;
            padding-left: 8px;
            font-weight: 500;
            width: 34%;
            font-size: 0.73rem;
            background-color: rgba(15, 15, 22, 0.45);
            color: #ffffff;
            text-shadow: 1px 1px 2px #000;
        }

        .player-col {
            width: 11%;
        }

        .mark-cell {
            cursor: pointer;
            height: 32px;
            font-size: 0.95rem;
            user-select: none;
            background-color: rgba(0, 0, 0, 0.2);
            transition: background 0.15s;
        }

        .mark-cell:active {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* SYMBOL COLORS WITH GLOW */
        .symbol-cross { color: #ff5252; font-weight: bold; text-shadow: 0 0 6px rgba(255,82,82,0.6); }
        .symbol-tick { color: #4eff7b; font-weight: bold; text-shadow: 0 0 6px rgba(78,255,123,0.6); }
        .symbol-question { color: #ffca28; font-weight: bold; text-shadow: 0 0 6px rgba(255,202,40,0.6); }

        /* MODAL DIALOG FOR PLAYER NAMES */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(6px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .modal-card {
            background: rgba(22, 22, 32, 0.95);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 16px;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.9);
        }

        .modal-card h2 {
            margin-top: 0;
            font-family: 'Pirata One', cursive, serif;
            color: var(--accent);
            font-size: 1.3rem;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: 1px;
        }

        .player-input-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .player-input-group label {
            width: 28px;
            font-weight: bold;
            color: var(--accent);
            font-size: 0.8rem;
        }

        .player-input-group input {
            flex: 1;
            padding: 6px 8px;
            background: #111118;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 4px;
            font-size: 0.82rem;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .modal-actions button {
            flex: 1;
            padding: 8px;
            border-radius: 6px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .btn-save { background: var(--accent); color: #000; }
        .btn-cancel { background: #333344; color: #fff; }
    </style>
</head>
<body>

    <header>
        <h1>One Piece Cluedo</h1>
    </header>

    <div class="controls">
        <button onclick="openPlayerModal()">⚙️ Set Players</button>
        <button onclick="clearMarks()">🧹 Clear Sheet</button>
        <button onclick="resetAll()">🔄 Reset All</button>
    </div>

    <!-- 3 HALF-TRANSPARENT TABLES -->
    <div id="tablesContainer" style="width: 100%; max-width: 500px;"></div>

    <!-- PLAYER NAMES MODAL DIALOG -->
    <div class="modal-overlay" id="playerModal">
        <div class="modal-card">
            <h2>⚙️ Edit Player Names</h2>
            <div id="modalInputs"></div>
            <div class="modal-actions">
                <button class="btn-save" onclick="savePlayerModal()">Save</button>
                <button class="btn-cancel" onclick="closePlayerModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const characters = ["Luffy", "Zoro", "Sanji", "Nami", "Usopp", "Robin", "Franky", "Chopper", "Brook"];
        const places = ["Land of Wano", "Fish-Man Island", "Dressrosa", "Punk Hazard", "Drum Kingdom", "Marineford", "Whole Cake Island", "Amazon Lily", "Water Seven"];
        const treasures = ["Treasure Chest", "Binoculars", "Necklace", "Pirate Coins", "Meat", "Sword"];

        const defaultPlayers = ["P1", "P2", "P3", "P4", "P5", "P6"];

        // Edit your custom picture icons here directly:
        const defaultIcons = {
            char: "https://api.iconify.design/ion:person.svg?color=%23f3c246",
            loc: "https://api.iconify.design/ion:location.svg?color=%23f3c246",
            treasure: "https://api.iconify.design/ion:ribbon.svg?color=%23f3c246"
        };

        const states = [
            { symbol: "", class: "" },
            { symbol: "❌", class: "symbol-cross" },
            { symbol: "✔", class: "symbol-tick" },
            { symbol: "❓", class: "symbol-question" }
        ];

        let players = [...defaultPlayers];
        let gameMarks = {}; 

        function init() {
            loadSavedData();
            renderTables();
        }

        function renderTables() {
            const container = document.getElementById("tablesContainer");
            container.innerHTML = "";

            renderSingleTable(container, "Characters", characters, "char");
            renderSingleTable(container, "Locations", places, "loc");
            renderSingleTable(container, "Treasures", treasures, "treasure");
        }

        function renderSingleTable(container, title, items, categoryKey) {
            const card = document.createElement("div");
            card.className = "table-card";

            // Category Banner
            const banner = document.createElement("div");
            banner.className = "category-header-banner";
            
            const img = document.createElement("img");
            img.className = "category-icon";
            img.src = defaultIcons[categoryKey];

            const titleSpan = document.createElement("span");
            titleSpan.textContent = title;

            banner.appendChild(img);
            banner.appendChild(titleSpan);
            card.appendChild(banner);

            const table = document.createElement("table");
            
            // Table Header
            let thHTML = `<tr><th class="item-cell">Clues</th>`;
            players.forEach(p => {
                thHTML += `<th class="player-col">${p}</th>`;
            });
            thHTML += `</tr>`;
            
            // Table Body
            let tbodyHTML = `<tbody>`;
            items.forEach((item, itemIdx) => {
                tbodyHTML += `<tr><td class="item-cell">${item}</td>`;
                for (let p = 0; p < 6; p++) {
                    const key = `${categoryKey}-${itemIdx}-${p}`;
                    const stateIdx = gameMarks[key] || 0;
                    const state = states[stateIdx];
                    tbodyHTML += `<td class="mark-cell ${state.class}" onclick="toggleMark('${key}')">${state.symbol}</td>`;
                }
                tbodyHTML += `</tr>`;
            });
            tbodyHTML += `</tbody>`;

            table.innerHTML = `<thead>${thHTML}</thead>${tbodyHTML}`;
            card.appendChild(table);

            container.appendChild(card);
        }

        function toggleMark(key) {
            let currentState = gameMarks[key] || 0;
            let nextState = (currentState + 1) % states.length;
            gameMarks[key] = nextState;
            saveData();
            renderTables();
        }

        /* PLAYER MODAL FUNCTIONS */
        function openPlayerModal() {
            const inputsDiv = document.getElementById("modalInputs");
            inputsDiv.innerHTML = "";
            players.forEach((p, i) => {
                inputsDiv.innerHTML += `
                    <div class="player-input-group">
                        <label>P${i+1}:</label>
                        <input type="text" id="pInput${i}" value="${p}" maxlength="6">
                    </div>
                `;
            });
            document.getElementById("playerModal").style.display = "flex";
        }

        function closePlayerModal() {
            document.getElementById("playerModal").style.display = "none";
        }

        function savePlayerModal() {
            for (let i = 0; i < 6; i++) {
                const val = document.getElementById(`pInput${i}`).value.trim();
                players[i] = val || `P${i+1}`;
            }
            saveData();
            renderTables();
            closePlayerModal();
        }

        /* STORAGE FUNCTIONS */
        function saveData() {
            localStorage.setItem("op_cluedo_players_v5", JSON.stringify(players));
            localStorage.setItem("op_cluedo_marks_v5", JSON.stringify(gameMarks));
        }

        function loadSavedData() {
            const savedPlayers = localStorage.getItem("op_cluedo_players_v5");
            if (savedPlayers) {
                try { players = JSON.parse(savedPlayers); } catch(e){}
            }

            const savedMarks = localStorage.getItem("op_cluedo_marks_v5");
            if (savedMarks) {
                try { gameMarks = JSON.parse(savedMarks); } catch(e){}
            }
        }

        function clearMarks() {
            if (confirm("Clear all marks on sheet?")) {
                gameMarks = {};
                saveData();
                renderTables();
            }
        }

        function resetAll() {
            if (confirm("Reset player names and marks?")) {
                localStorage.removeItem("op_cluedo_players_v5");
                localStorage.removeItem("op_cluedo_marks_v5");
                players = [...defaultPlayers];
                gameMarks = {};
                renderTables();
            }
        }

        init();
    </script>
</body>
</html>
