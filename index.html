<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>One Piece Cluedo Helper</title>
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0d0d12;
            --panel-bg: rgba(22, 22, 30, 0.95);
            --header-bg: #1a1a26;
            --accent: #e5b842;
            --border: #333344;
            --text: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            
            background-image: 
                radial-gradient(circle at center, rgba(30,30,45,0.6) 0%, rgba(10,10,15,0.95) 100%), 
                url('https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        header {
            text-align: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--accent);
            margin: 0;
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .subtitle {
            font-size: 0.8rem;
            color: #888;
            margin-top: 3px;
        }

        .controls {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
            margin-bottom: 12px;
        }

        .controls button {
            flex: 1;
            background: var(--header-bg);
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .controls button:active {
            background: var(--accent);
            color: #000;
        }

        /* MATRIX TABLE STYLES (MATCHING CLUEDO GOT) */
        .table-wrapper {
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            background: var(--panel-bg);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 480px;
        }

        th, td {
            border: 1px solid var(--border);
            padding: 8px 4px;
            text-align: center;
            font-size: 0.9rem;
        }

        th {
            background-color: var(--header-bg);
            color: var(--accent);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th.category-row {
            background-color: #111118;
            color: #fff;
            text-align: left;
            padding-left: 10px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .item-cell {
            text-align: left;
            padding-left: 10px;
            font-weight: 500;
            min-width: 130px;
            background-color: rgba(25, 25, 35, 0.7);
        }

        .player-header input {
            background: transparent;
            border: none;
            color: var(--accent);
            font-weight: bold;
            font-size: 0.85rem;
            text-align: center;
            width: 100%;
            font-family: inherit;
        }

        .mark-cell {
            cursor: pointer;
            width: 42px;
            height: 40px;
            font-size: 1.2rem;
            user-select: none;
            transition: background 0.15s;
        }

        .mark-cell:hover {
            background-color: rgba(255, 255, 255, 0.08);
        }

        /* SYMBOL COLORS */
        .symbol-cross { color: #ff5252; font-weight: bold; }
        .symbol-tick { color: #4eff7b; font-weight: bold; }
        .symbol-question { color: #ffca28; font-weight: bold; }

        /* QR CODE PANEL */
        .qr-card {
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .qr-card h3 {
            margin: 0 0 10px 0;
            color: var(--accent);
            font-size: 0.95rem;
        }

        #qrcode {
            background: #fff;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🏴‍☠️ One Piece Cluedo</h1>
        <div class="subtitle">Interactive Detective Sheet</div>
    </header>

    <div class="controls">
        <button onclick="clearMarks()">Clear Sheet</button>
        <button onclick="resetAll()">Reset Names & Marks</button>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="min-width: 130px;">Clues</th>
                    <th class="player-header"><input type="text" id="p0" value="Luffy" onchange="savePlayers()"></th>
                    <th class="player-header"><input type="text" id="p1" value="Zoro" onchange="savePlayers()"></th>
                    <th class="player-header"><input type="text" id="p2" value="Sanji" onchange="savePlayers()"></th>
                    <th class="player-header"><input type="text" id="p3" value="Nami" onchange="savePlayers()"></th>
                    <th class="player-header"><input type="text" id="p4" value="Usopp" onchange="savePlayers()"></th>
                    <th class="player-header"><input type="text" id="p5" value="Robin" onchange="savePlayers()"></th>
                </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
        </table>
    </div>

    <div class="qr-card">
        <h3>📱 Scan to Open Sheet on Your Phone</h3>
        <div id="qrcode"></div>
    </div>

    <script>
        const characters = ["Luffy", "Zoro", "Sanji", "Nami", "Usopp", "Robin", "Franky", "Chopper", "Brook"];
        const places = ["Land of Wano", "Fish-Man Island", "Dressrosa", "Punk Hazard", "Drum Kingdom", "Marineford", "Whole Cake Island", "Amazon Lily", "Water Seven"];
        const treasures = ["Treasure Chest", "Binoculars", "Necklace", "Pirate Coins", "Meat", "Sword"];

        const defaultPlayers = ["Luffy", "Zoro", "Sanji", "Nami", "Usopp", "Robin"];

        const states = [
            { symbol: "", class: "" },
            { symbol: "❌", class: "symbol-cross" },
            { symbol: "✔", class: "symbol-tick" },
            { symbol: "❓", class: "symbol-question" }
        ];

        let gameMarks = {}; // Stores matrix keys "catKey-itemIdx-pIdx": stateIdx

        function init() {
            loadSavedData();
            renderTable();
            generateQRCode();
        }

        function generateQRCode() {
            new QRCode(document.getElementById("qrcode"), {
                text: window.location.href,
                width: 120,
                height: 120
            });
        }

        function renderTable() {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";

            renderSection(tbody, "Characters", characters, "char");
            renderSection(tbody, "Locations", places, "loc");
            renderSection(tbody, "Treasures", treasures, "treasure");
        }

        function renderSection(tbody, title, items, categoryKey) {
            // Category Header Row
            const headerRow = document.createElement("tr");
            headerRow.innerHTML = `<th colspan="7" class="category-row">${title}</th>`;
            tbody.appendChild(headerRow);

            // Items Rows
            items.forEach((item, itemIdx) => {
                const row = document.createElement("tr");

                // Item Name Cell
                const nameCell = document.createElement("td");
                nameCell.className = "item-cell";
                nameCell.textContent = item;
                row.appendChild(nameCell);

                // 6 Player Columns
                for (let p = 0; p < 6; p++) {
                    const cell = document.createElement("td");
                    cell.className = "mark-cell";
                    const key = `${categoryKey}-${itemIdx}-${p}`;
                    const stateIdx = gameMarks[key] || 0;
                    const state = states[stateIdx];

                    cell.textContent = state.symbol;
                    cell.className = `mark-cell ${state.class}`;

                    cell.onclick = () => {
                        let nextState = (stateIdx + 1) % states.length;
                        gameMarks[key] = nextState;
                        saveMarks();
                        renderTable();
                    };

                    row.appendChild(cell);
                }

                tbody.appendChild(row);
            });
        }

        function savePlayers() {
            const playerNames = [];
            for (let i = 0; i < 6; i++) {
                playerNames.push(document.getElementById(`p${i}`).value);
            }
            localStorage.setItem("op_cluedo_players", JSON.stringify(playerNames));
        }

        function saveMarks() {
            localStorage.setItem("op_cluedo_marks", JSON.stringify(gameMarks));
        }

        function loadSavedData() {
            const savedPlayers = localStorage.getItem("op_cluedo_players");
            if (savedPlayers) {
                try {
                    const names = JSON.parse(savedPlayers);
                    names.forEach((name, i) => {
                        const input = document.getElementById(`p${i}`);
                        if (input) input.value = name;
                    });
                } catch(e){}
            }

            const savedMarks = localStorage.getItem("op_cluedo_marks");
            if (savedMarks) {
                try { gameMarks = JSON.parse(savedMarks); } catch(e){}
            }
        }

        function clearMarks() {
            if (confirm("Clear all ticks, crosses, and question marks?")) {
                gameMarks = {};
                saveMarks();
                renderTable();
            }
        }

        function resetAll() {
            if (confirm("Reset player names and all marks?")) {
                localStorage.removeItem("op_cluedo_marks");
                localStorage.removeItem("op_cluedo_players");
                gameMarks = {};
                defaultPlayers.forEach((name, i) => {
                    document.getElementById(`p${i}`).value = name;
                });
                renderTable();
            }
        }

        init();
    </script>
</body>
</html>

    </script>
</body>
</html>
